<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Víctor Bueno · v1nl4nd · Ciberseguridad">
  <!--
    PALETA (cámbiala por los hex exactos de v1nl4nd.com):
      fondo  #0b0e14 · panel #11151c · borde #1f2630
      texto  #e6e6e6 · apagado #8b949e
      rojo   #e5484d · teal #2dd4bf
    Nota: GitHub muestra este SVG como <img>, así que no puede cargar
    fuentes web; se usan fuentes del sistema como respaldo.
  -->
  <defs>
    <style>
      .mono  { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .serif { font-family: Georgia,'Iowan Old Style','Times New Roman',serif; }
      .txt   { fill: #e6e6e6; }
      .dim   { fill: #8b949e; }
      .red   { fill: #e5484d; }
      .teal  { fill: #2dd4bf; }
      .in    { animation: aparecer .6s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; }
      .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.7s; }
      .cursor { animation: parpadeo 1.1s steps(1) infinite; }
      @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes parpadeo { 50% { opacity: 0; } }
    </style>
    <pattern id="rejilla" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="desvanecer" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0e14" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0b0e14" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0b0e14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo y rejilla -->
  <rect width="1200" height="320" rx="12" fill="#0b0e14"/>
  <rect x="0" y="40" width="1200" height="280" fill="url(#rejilla)"/>
  <rect x="0" y="40" width="1200" height="280" fill="url(#desvanecer)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="12" fill="none" stroke="#1f2630"/>

  <!-- Barra de ventana de terminal -->
  <path d="M12 .5H1188A11.5 11.5 0 0 1 1199.5 12V40H.5V12A11.5 11.5 0 0 1 12 .5Z" fill="#11151c"/>
  <line x1="0" y1="40.5" x2="1200" y2="40.5" stroke="#1f2630"/>
  <circle cx="26" cy="20" r="6" fill="#e5484d"/>
  <circle cx="46" cy="20" r="6" fill="#30363d"/>
  <circle cx="66" cy="20" r="6" fill="#2dd4bf"/>
  <text x="600" y="25" text-anchor="middle" class="mono dim" font-size="13">v1nl4nd@vinland: ~</text>

  <!-- Prompt -->
  <text x="60" y="98" class="mono in d1" font-size="18">
    <tspan class="teal">v1nl4nd@vinland</tspan><tspan class="dim">:</tspan><tspan class="red">~</tspan><tspan class="dim">$ </tspan><tspan class="txt">whoami</tspan>
  </text>

  <!-- Nombre (serif editorial) -->
  <text x="58" y="172" class="serif txt in d2" font-size="66" font-style="italic" letter-spacing="-1">Víctor Bueno<tspan class="red">.</tspan></text>
  <rect x="60" y="192" width="96" height="3" class="red in d2"/>

  <!-- Subtítulo -->
  <text x="60" y="232" class="mono in d3" font-size="19">
    <tspan class="dim">// </tspan><tspan class="txt">ciberseguridad</tspan><tspan class="dim"> · </tspan><tspan class="red">red team</tspan><tspan class="dim"> + </tspan><tspan class="teal">blue team</tspan>
  </text>

  <!-- Línea final con cursor -->
  <text x="60" y="276" class="mono in d4" font-size="18">
    <tspan class="teal">v1nl4nd@vinland</tspan><tspan class="dim">:</tspan><tspan class="red">~</tspan><tspan class="dim">$ </tspan><tspan class="teal cursor">█</tspan>
  </text>

  <!-- Huella GPG como detalle decorativo -->
  <g class="mono teal" font-size="15" text-anchor="end" opacity=".32">
    <text x="1140" y="100">951D E000 8817 6905</text>
    <text x="1140" y="126">1FEC B516 A6C5 A42B</text>
    <text x="1140" y="152">B009 DC25</text>
  </g>
  <text x="1140" y="186" class="mono dim" font-size="12" text-anchor="end" opacity=".7">gpg · contact@v1nl4nd.com</text>
</svg>
